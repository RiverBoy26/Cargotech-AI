server:
  port: 8081

spring:
  application:
    name: cargotech-ai
  docker:
    compose:
      enabled: false

gigachat:
  auth-url: ${GIGACHAT_AUTH_URL:https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
  chat-url: ${GIGACHAT_CHAT_URL:https://gigachat.devices.sberbank.ru/api/v1/chat/completions}
  scope: ${GIGACHAT_SCOPE:GIGACHAT_API_B2B}
  client-id: ${GIGACHAT_CLIENT_ID:}
  auth-key: ${GIGACHAT_AUTH_KEY:}
  chat-model: ${GIGACHAT_CHAT_MODEL:GigaChat-2-Pro}
  temperature: ${GIGACHAT_TEMPERATURE:0.1}
  max-tokens: ${GIGACHAT_MAX_TOKENS:1000}
  token-refresh-skew-seconds: ${GIGACHAT_TOKEN_REFRESH_SKEW_SECONDS:60}