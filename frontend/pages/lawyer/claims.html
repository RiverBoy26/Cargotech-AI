<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дашборд претензий</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
      <button class="logout_btn" id="logout_btn" type="button">Выйти из аккаунта</button>
      <div class="topbar_user">
        <div class="topbar_usename">Иванов Иван Иванович</div>
        <div class="topbar_user_role">юрист</div>
      </div>
    </header>
    <main>
        <div class="toolbar">
            <div class="search_box">
                <span class="search-box__icon">
                    <img src="../../assets/Search.svg" alt="Search">
                </span>
                <input
                class="search-box__input"
                id="claim_search"
                name="claim_search"
                autocomplete="off"
                type="search"
                placeholder="Поиск по перевозчику, клиенту, рейсу...">
            </div>
            <select class="status_filter" id="claim_status_filter" aria-label="Фильтр по статусу претензии">
                <option value="">Все статусы</option>
                <option value="DRAFT">Черновик</option>
                <option value="PENDING_LEGAL_REVIEW">На проверке</option>
                <option value="LEGAL_APPROVED">Утверждено</option>
                <option value="SENT">Отправлено</option>
                <option value="AWAITING_RESPONSE">Ожидание ответа</option>
                <option value="PAID">Оплачено</option>
                <option value="ESCALATED_TO_COURT">Передано в суд</option>
                <option value="CANCELLED">Отменено</option>
                <option value="CANCELLED_PAID">Оплачено до отправки</option>
                <option value="CLOSED_IN_COURT">Закрыто судом</option>
            </select>
            <button class="primary_btn" id="create_claim_btn">+ Создать претензию</button>
        </div>
        <div class="add_claim_form" id="add_claim_form">
            <div class="add_claim_form_title">Новая претензия</div>
            <div class="add_claim_form_fields">

                <div class="form_field">
                    <label class="form_label" for="claim_shipment_id">Рейс *</label>
                    <select class="form_input form_select" id="claim_shipment_id" required>
                        <option value="">— выберите рейс —</option>
                    </select>
                </div>

                <div class="form_field">
                    <label class="form_label" for="claim_type">Тип претензии *</label>
                    <select class="form_input form_select" id="claim_type" required>
                        <option value="">— выберите тип —</option>
                        <option value="PAYMENT_DELAY">Задержка оплаты</option>
                    </select>
                </div>

                <div class="form_field">
                    <label class="form_label" for="claim_number">Номер претензии</label>
                    <input class="form_input" id="claim_number" name="claim_number" autocomplete="off" type="text"
                        placeholder="CT-2026-001 (необязательно)">
                </div>

                <div class="form_field">
                    <label class="form_label" for="claim_principal_debt">Сумма долга (₽)</label>
                    <input class="form_input" id="claim_principal_debt" name="claim_principal_debt" autocomplete="off" type="number" readonly
                        placeholder="150000" min="0" step="0.01">
                </div>

                <div class="form_field form_field_wide">
                    <label class="form_label" for="claim_reason">Основание претензии *</label>
                    <input class="form_input" id="claim_reason" name="claim_reason" autocomplete="off" type="text" required
                        placeholder="Не оплачены транспортно-экспедиционные услуги по рейсу AA-1111">
                </div>

            </div>

            <div class="add_claim_form_footer">
                <div class="add_claim_form_actions">
                    <p class="form_error" id="claim_form_error"></p>
                    <button class="secondary_btn" id="cancel_claim_btn">Отмена</button>
                    <button class="primary_btn" id="save_claim_btn">Создать</button>
                </div>
            </div>
        </div>
        <div class="claims_table">
            <div class="claims_table_head">
                <div class="claims_table_head_t">Клиент</div>
                <div class="claims_table_head_t">Экспедитор</div>
                <div class="claims_table_head_t">Рейс</div>
                <div class="claims_table_head_t">Просрочка</div>
                <div class="claims_table_head_t">Сумма долга</div>
                <div class="claims_table_head_t">Неустойка</div>
                <div class="claims_table_head_t">Статус</div>
            </div>
            <div class="claims_list" id="claims_list"></div>
        </div>
    </main>
    <script src="../../scripts/api.js?v=20260804-user-name-fields-2"></script>
    <script src="../../scripts/script.js"></script>
</body>
