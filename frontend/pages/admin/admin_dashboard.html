<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Администратор экспедитора</title>
    <link rel="stylesheet" href="../../styles/admin_dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="topbar_user">
            <div class="topbar_usename">Громова Елена Викторовна</div>
            <div class="topbar_user_role">администратор экспедитора</div>
        </div>
    </header>

    <main>
        <div class="page_title_row">
            <h1 class="page_title">Настройки экспедитора</h1>
        </div>

        <!-- ===== Вкладка: Пользователи ===== -->
        <section class="tab_panel tab_panel_active" id="tab_panel_users">

            <div class="panel_header_row">
                <p class="panel_subtitle">Сотрудники экспедитора и их роли в системе</p>
                <button class="primary_btn" id="add_user_btn">+ Добавить пользователя</button>
            </div>

            <!-- Форма добавления пользователя — скрыта по умолчанию -->
            <div class="add_user_form" id="add_user_form">
                <div class="add_user_form_title">Новый пользователь</div>
                <div class="add_user_form_fields">
                    <div class="form_field">
                        <label class="form_label" for="field_fullname">ФИО</label>
                        <input class="form_input" id="field_fullname" type="text" placeholder="Иванов Иван Иванович">
                    </div>
                    <div class="form_field">
                        <label class="form_label" for="field_email">Email</label>
                        <input class="form_input" id="field_email" type="email" placeholder="ivanov@expeditor.ru">
                    </div>
                    <div class="form_field">
                        <label class="form_label" for="field_password">Пароль</label>
                        <input class="form_input" id="field_password" type="password" placeholder="мин. 8 символов">
                    </div>
                    <div class="form_field">
                        <label class="form_label" for="field_role">Роль</label>
                        <select class="form_input form_select" id="field_role">
                            <option value="">— выберите роль —</option>
                            <option value="LAWYER">Юрист</option>
                            <option value="ACCOUNTANT">Бухгалтер</option>
                        </select>
                    </div>
                </div>
                <div class="add_user_form_actions">
                    <button class="primary_btn" id="save_user_btn">Добавить</button>
                    <button class="secondary_btn" id="cancel_user_btn">Отмена</button>
                </div>
            </div>

            <div class="users_table">
                <div class="users_table_head">
                    <div class="users_table_head_t">ФИО</div>
                    <div class="users_table_head_t">Email</div>
                    <div class="users_table_head_t">Роль</div>
                    <div class="users_table_head_t">Статус</div>
                    <div class="users_table_head_t">Действие</div>
                </div>
                <div class="users_list" id="users_list"></div>
            </div>

        </section>

    </main>

    <!--  Модалка просмотра пользователя  -->
    <div class="modal_overlay" id="user_modal_overlay">
        <div class="modal">
            <div class="modal_header">
                <div class="modal_title" id="modal_user_name">—</div>
                <button class="modal_close_btn" id="modal_close_btn">&#10005;</button>
            </div>
            <div class="modal_body">
                <div class="modal_field_grid">
                    <div class="modal_field">
                        <div class="modal_field_label">Email</div>
                        <div class="modal_field_value" id="modal_user_email">—</div>
                    </div>
                    <div class="modal_field">
                        <div class="modal_field_label">Роль</div>
                        <div class="modal_field_value" id="modal_user_role">—</div>
                    </div>
                    <div class="modal_field">
                        <div class="modal_field_label">Статус</div>
                        <div class="modal_field_value" id="modal_user_status">—</div>
                    </div>
                    <div class="modal_field">
                        <div class="modal_field_label">Экспедитор</div>
                        <div class="modal_field_value" id="modal_user_expeditor">—</div>
                    </div>
                </div>
                <div class="modal_loading" id="modal_loading">Загрузка...</div>
                <div class="modal_error" id="modal_error"></div>
            </div>
            <div class="modal_footer">
                <button class="secondary_btn" id="modal_close_footer_btn">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="../../scripts/api.js"></script>
    <script src="../../scripts/admin_script.js"></script>
</body>
</html>
