components:
  schemas:
    ShipmentRequest:
      type: object
      properties:
        orderNumber:
          type: string
          maxLength: 128
          minLength: 0
        clientId:
          type: string
          format: uuid
        expeditorId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        routeFrom:
          type: string
          maxLength: 500
          minLength: 0
        routeTo:
          type: string
          maxLength: 500
          minLength: 0
        loadingDate:
          type: string
          format: date
        unloadingDate:
          type: string
          format: date
        actSignedAt:
          type: string
          format: date
        serviceAmount:
          type: number
        currency:
          type: string
          maxLength: 10
          minLength: 0
        status:
          type: string
          enum:
          - CREATED
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
        externalId:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - clientId
      - contractId
      - expeditorId
      - orderNumber
      - serviceAmount
    ShipmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        orderNumber:
          type: string
        clientId:
          type: string
          format: uuid
        clientName:
          type: string
        expeditorId:
          type: string
          format: uuid
        expeditorName:
          type: string
        contractId:
          type: string
          format: uuid
        contractNumber:
          type: string
        routeFrom:
          type: string
        routeTo:
          type: string
        loadingDate:
          type: string
          format: date
        unloadingDate:
          type: string
          format: date
        actSignedAt:
          type: string
          format: date
        serviceAmount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum:
          - CREATED
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
        externalId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PartyRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - CLIENT
          - EXPEDITOR
          - CARRIER
          - THIRD_PARTY
        name:
          type: string
          maxLength: 500
          minLength: 0
        inn:
          type: string
          maxLength: 12
          minLength: 0
        kpp:
          type: string
          maxLength: 9
          minLength: 0
        ogrn:
          type: string
          maxLength: 15
          minLength: 0
        legalAddress:
          type: string
        postalAddress:
          type: string
        email:
          type: string
          format: email
          maxLength: 320
          minLength: 0
        phone:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - name
      - type
    PartyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - CLIENT
          - EXPEDITOR
          - CARRIER
          - THIRD_PARTY
        name:
          type: string
        inn:
          type: string
        kpp:
          type: string
        ogrn:
          type: string
        legalAddress:
          type: string
        postalAddress:
          type: string
        email:
          type: string
        phone:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContractIntakeRequest:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
      required:
      - clientId
      - documentId
    ContractRequest:
      type: object
      properties:
        number:
          type: string
          maxLength: 128
          minLength: 0
        clientId:
          type: string
          format: uuid
        expeditorId:
          type: string
          format: uuid
        signedAt:
          type: string
          format: date
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - EXPIRED
          - TERMINATED
          - ARCHIVED
        paymentDays:
          type: integer
          format: int32
          minimum: 0
        paymentStartEvent:
          type: string
          enum:
          - ACT_SIGNED
          - UNLOADING_DATE
          - TTN_SIGNED
          - INVOICE_DATE
        penaltyType:
          type: string
          enum:
          - CONTRACT_PENALTY
          - ARTICLE_395
