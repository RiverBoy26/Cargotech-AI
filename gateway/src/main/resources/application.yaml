server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway


  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Auth-сервис
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**

            # Payment-сервис
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/payments/**

            # Claim-сервис
            - id: claim-service
              uri: ${CLAIM_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/claims/**,/api/v1/contracts/**,/api/v1/parties/**,/api/v1/shipments/**,/api/v1/calculations/**